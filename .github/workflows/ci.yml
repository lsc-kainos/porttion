name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + typecheck + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-secret-must-be-at-least-32-chars
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          ADMIN_EMAILS: ''
          API_URL: http://localhost:3001
          DATABASE_URL: postgresql://kainos:kainos@localhost:5432/kainos
          ALLOWED_ORIGINS: http://localhost:3000
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token-must-be-at-least-32-chars
          STORAGE_URL_SECRET: ci-storage-url-secret-must-be-at-least-32-chars
          VOLUME_ROOT: /tmp/ci-volume
        run: npm run build

      - name: Test
        env:
          NEXTAUTH_SECRET: ci-build-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://kainos:kainos@localhost:5432/kainos
          ALLOWED_ORIGINS: http://localhost:3000
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token-must-be-at-least-32-chars
          STORAGE_URL_SECRET: ci-storage-url-secret-must-be-at-least-32-chars
          VOLUME_ROOT: /tmp/ci-volume
        run: npm run test

      - name: Coverage gate (API)
        env:
          DATABASE_URL: postgresql://kainos:kainos@localhost:5432/kainos
          ALLOWED_ORIGINS: http://localhost:3000
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token-must-be-at-least-32-chars
          STORAGE_URL_SECRET: ci-storage-url-secret-must-be-at-least-32-chars
          VOLUME_ROOT: /tmp/ci-volume
        run: |
          cd apps/api && npx jest --coverage --coverageReporters=json-summary
          npx tsx scripts/check-coverage.ts

      - name: i18n check
        run: cd apps/web && npx tsx scripts/i18n-check.ts

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kainos
          POSTGRES_PASSWORD: kainos
          POSTGRES_DB: kainos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Setup DB
        env:
          DATABASE_URL: postgresql://kainos:kainos@localhost:5432/kainos
        run: |
          cd apps/api && npx prisma migrate deploy && npx prisma db seed
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run e2e (desktop + iPhone 13)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kainos:kainos@localhost:5432/kainos
          NEXTAUTH_SECRET: e2e-secret-must-be-at-least-32-chars-long
          INTERNAL_SERVICE_TOKEN: e2e-internal-token-must-be-at-least-32-chars
          STORAGE_URL_SECRET: e2e-storage-url-secret-must-be-at-least-32-chars
          VOLUME_ROOT: /tmp/ci-volume
          ALLOWED_ORIGINS: http://localhost:3000
          API_URL: http://localhost:3001
          AI_RUNTIME_FIXTURE: 'true'
          RESEND_API_KEY: re_test_key
          EMAIL_FROM: e2e@porttion.test
          APP_URL: http://localhost:3000
        run: cd apps/web && npx playwright test
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
