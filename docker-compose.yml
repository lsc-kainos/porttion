services:
  postgres:
    image: postgres:16-alpine
    container_name: kainos-postgres
    environment:
      POSTGRES_USER: kainos
      POSTGRES_PASSWORD: kainos
      POSTGRES_DB: kainos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kainos -d kainos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kainos-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
